<div class="container mt-4">
    <h2>Liste des Livres</h2>
    <a routerLink="/ajoutLivre" class="btn btn-success">➕ Ajouter un livre</a>&nbsp;

    <div *ngIf="msgError" class="alert alert-danger">
      {{ msgError }}
    </div>
  &nbsp;
    <table class="table table-striped table-bordered" *ngIf="livres.length > 0">
      <thead class="table-info">
        <tr>
          <th>Titre</th>
          <th>Auteur</th>
          <th>Genre</th>
          <th>Description</th>
          <th>ISBN</th>
          <th>UrlImage</th>
          <th>Date de publication</th>
          <th>action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let livre of livres">
          <td>{{ livre.titre }}</td>
          <td>{{ livre.auteur }}</td>
          <td>{{ livre.genre }}</td>
          <td>{{ livre.description }}</td>
          <td>{{ livre.isbn }}</td>
          <td><img [src]="livre.urlImage" alt="Image du livre" class="image-livre"/></td>
          <td>{{ livre.datePublication | date:'dd/MM/yyyy' }}</td>
          <td>
            <button *ngIf="estAdmin" (click)="modifierLivre(livre.id)" class="btn btn-sm btn-primary me-2">Modifier</button>&nbsp;
            <button *ngIf="estAdmin" (click)="supprimerLivre(livre.id)" class="btn btn-sm btn-danger">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="livres.length === 0 && !msgError">Aucun livre trouvé.</p>
  </div>
